<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <circle cx="960" cy="60" r="260" fill="url(#glow)"/>
  <circle cx="150" cy="260" r="180" fill="url(#glow)" opacity="0.5"/>

  <!-- decorative scan rings, right side -->
  <g opacity="0.5" transform="translate(980,140)">
    <circle r="46" fill="none" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="80" fill="none" stroke="#818cf8" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle r="114" fill="none" stroke="#818cf8" stroke-opacity="0.12" stroke-width="1.5"/>
    <circle r="4" fill="#a78bfa"/>
    <circle cx="80" cy="-16" r="3" fill="#a78bfa" opacity="0.8"/>
    <circle cx="-70" cy="40" r="2.5" fill="#a78bfa" opacity="0.6"/>
    <circle cx="30" cy="98" r="2.5" fill="#a78bfa" opacity="0.7"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(96,90)">
    <rect width="100" height="100" rx="24" fill="#7c3aed"/>
    <path d="M50 20 L78 32 V54 C78 74 66 88 50 94 C34 88 22 74 22 54 V32 Z"
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M39 56 L47 64 L64 45" fill="none" stroke="#ffffff" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="228" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800"
        fill="#ffffff" letter-spacing="1">VEXYRON</text>
  <text x="230" y="182" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700"
        fill="#a5b4fc" letter-spacing="4">SECURITY VALIDATION PLATFORM</text>
  <text x="230" y="216" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400"
        fill="#8b93a7">Kendi uygulamanı production'a çıkmadan önce tara — kanıtlı, tekrarlanabilir bir sonuçla.</text>
</svg>
